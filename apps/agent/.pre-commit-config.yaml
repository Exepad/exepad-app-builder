repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black --check
        language: system
        types: [python]

      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]

      - id: unit-tests
        name: unit tests
        entry: pytest tests/unit/ -x -q
        language: system
        pass_filenames: false
        always_run: true
