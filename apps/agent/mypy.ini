[mypy]
# Python version
python_version = 3.12

# Warning settings
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True

# Strict optional typing
strict_optional = True

# Check untyped definitions
check_untyped_defs = True

# Ignore missing imports (for external libraries without stubs)
ignore_missing_imports = True

# Show error codes in output
show_error_codes = True

# Show column numbers in errors
show_column_numbers = True

# Pretty output
pretty = True

# Pydantic plugin for better model support
plugins = pydantic.mypy

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True

# Per-module overrides
[mypy-tests.*]
# Less strict for tests
ignore_errors = True

[mypy-google.*]
# Google ADK doesn't have type stubs
ignore_missing_imports = True

[mypy-google.adk.*]
ignore_missing_imports = True

[mypy-structlog.*]
ignore_missing_imports = True
