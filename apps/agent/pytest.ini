[pytest]
# Test discovery paths
testpaths = tests

# Test file patterns
python_files = test_*.py

# Test class patterns
python_classes = Test*

# Test function patterns
python_functions = test_*

# Default command line options
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Custom markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require services)
    slow: Slow running tests
    e2e: End-to-end tests for /r endpoint
    websites: Website app type tests
    forms: Form app type tests
    dataapps: Data app type tests
    blogging: Blogging workflow tests
    eval: ADK evaluation tests (all agents)
    eval_fast: Fast ROUGE-1 evaluation tests (CI/CD friendly)
    eval_rubric: LLM-as-judge rubric evaluation tests (slower, higher confidence)
    eval_routing: Routing layer evaluations (AppHelpDeskAgent)
    eval_planning: Planning layer evaluations (AppCreator, AppEditor, AppBlogger)
    eval_building: Building-layer deterministic replay and pipeline confidence tests
    eval_support: Support layer evaluations (ImageFinder, ExampleSelector, ResponseWriter)
    benchmark: Performance benchmark tests (scaffold config size, error rate, timing)
    replay: Sanitized replay corpus tests for deterministic confidence checks
    confidence_pr: Fast deterministic confidence subset suitable for PR gating
    nightly: Extended deterministic confidence coverage intended for scheduled runs

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Async mode for pytest-asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

# Minimum pytest version
minversion = 8.0
