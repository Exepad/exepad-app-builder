# Real-container smoke on macOS and Windows, on hosted runners.
#
# packaging-ci already proves the INSTALLERS parse and execute on both platforms
# (macOS under bash 3.2, Windows through a real msiexec install/uninstall). What
# neither runner has is a Docker that can run our linux/amd64 image, so the half
# that actually matters — pull the image, start the studio, answer 200, surface
# the setup token — has only ever been proven on Linux.
#
# Both routes were MEASURED on 2026-07-28 rather than assumed, and the common
# assumption ("hosted runners can't do this") turned out to be half wrong:
#
#   macOS   : Colima needs a hypervisor, and GitHub's arm64 runners cannot
#             provide one — they are themselves VMs on Apple Virtualization, M1
#             has no nested-virt support in hardware, and Apple only added it on
#             M3 + macOS 15. So this job runs on the INTEL image, which does.
#   Windows : HypervisorPresent=True on Windows Server 2025, and WSL2 + Ubuntu
#             install cleanly with Docker Engine 29.6.2 linux/amd64 inside. The
#             daemon is exposed over TCP so the *Windows* docker.exe drives it,
#             which is the shape a Docker Desktop user actually has.
#
# The Windows job stays non-blocking: it is exploratory infrastructure, and a
# runner limitation is not a product defect and must never be reported as one.
#
# Uses the `-lite` tag (no bundled Chromium, ~1.4 GB smaller uncompressed): these
# runners are slow enough that it is the difference between viable and not.
name: container-smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to smoke (e.g. 1.0.1 or latest)'
        required: false
        default: 'latest'

jobs:
  macos:
    name: macOS — real container via Colima
    # INTEL, deliberately, and not macos-latest.
    #
    # Measured on 2026-07-28: Colima cannot start on GitHub's arm64 macOS runners.
    # The `vz` driver dies during hostagent startup, and the reason is hardware,
    # not configuration — GitHub's macOS runners are themselves VMs on Apple
    # Virtualization, M1 has no nested-virtualisation support at all, and Apple
    # only added it on M3 + macOS 15. No flag fixes that; the runner has to change.
    # (Chasing this cost two runs: first --vz-rosetta failing at "Setting up
    # Rosetta share", then vz failing for the real underlying reason.)
    #
    # Intel runners have the hypervisor, which is why the community
    # setup-docker-macos actions support Intel images and refuse arm64.
    #
    # NOT macos-13: that image was RETIRED on 2025-12-04, and the label no longer
    # resolves — a job requesting it queues forever with no runner and no error,
    # which is exactly what happened here before this was tracked down.
    # `macos-15-intel` is its replacement.
    #
    # EXPIRY, deliberately recorded: GitHub drops x86_64 macOS entirely after
    # August 2027. When that lands, this job has to move to arm64 runners, which
    # means it needs M3-class hardware (nested virt) to exist on GitHub's fleet —
    # or the coverage moves to a rented Apple-silicon host.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Runner capability
        run: |
          uname -m
          sw_vers
          sysctl -n machdep.cpu.brand_string || true
          command -v docker || echo "(no docker CLI preinstalled — expected)"
          command -v colima || echo "(no colima preinstalled — expected)"

      - name: Install + start Colima
        run: |
          set -euo pipefail
          # qemu is NOT implied by the colima formula, and its absence surfaces
          # only at start time as "cannot use vmType: 'qemu' … qemu-img not found".
          brew install colima docker qemu
          colima start --cpu 3 --memory 6 --disk 20
          docker version
          docker run --rm hello-world

      - name: Install the studio exactly as a macOS user would
        env:
          VER: ${{ inputs.version || 'latest' }}
        run: |
          set -euo pipefail
          # The RELEASE's installer from the public front door — the artifact a
          # real user actually downloads, not this checkout's copy.
          curl -fsSL https://get.exepad.com -o rel-install.sh
          # --no-node: force the embedded bootstrap. That is the path every
          # one-click bundle and every Node-less machine takes, and the one that
          # had no real-container coverage at all.
          bash rel-install.sh --yes --no-node \
            --version "${VER}-lite" \
            --dir "$PWD/inst" --port 8097 2>&1 | tee install.log

      - name: Studio answers, and the setup token was surfaced
        run: |
          set -euo pipefail
          code=""
          for _ in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8097/ || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ] || { echo "::error::studio never answered on macOS (last: ${code:-none})"; exit 1; }
          echo "studio 200 on macOS"
          grep -q 'Setup token:' install.log \
            || { echo "::error::installer did not surface the first-run setup token on macOS"; exit 1; }
          echo "setup token surfaced on macOS"
          # The compose the bootstrap wrote must pin the tag it was asked for.
          grep -q "exepad-app-builder:${VERSION}-lite" inst/docker-compose.yml \
            || { echo "::error::compose is not pinned to the requested tag"; cat inst/docker-compose.yml; exit 1; }
          echo "compose pinned correctly"
        env:
          VERSION: ${{ inputs.version || 'latest' }}

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs exepad 2>&1 | tail -60 || true
          cat install.log || true
          colima status || true
          # The Lima hostagent's real error never reaches colima's own output —
          # it reports an empty `Errors:[]` and points here. Not capturing this
          # is what made the first arm64 failure look like a config problem.
          for f in ~/.colima/_lima/colima/ha.stderr.log ~/.colima/_lima/colima/serial*.log; do
            [ -f "$f" ] && { echo "----- $f -----"; tail -40 "$f"; }
          done || true

  windows:
    name: Windows — install.ps1 against a real Linux daemon (WSL2)
    runs-on: windows-2025
    timeout-minutes: 60
    # Non-blocking: this is exploratory infrastructure, and a hosted-runner
    # limitation is not a product defect. It must never fail a release.
    continue-on-error: true
    steps:
      # Measured on 2026-07-28: HypervisorPresent=True on Windows Server 2025,
      # docker CLI 29.1.5 preinstalled (windows/amd64 client). Nested
      # virtualisation is what WSL2 needs, so the Linux-daemon route is open.
      - name: Runner capability
        shell: pwsh
        run: |
          Write-Host "HypervisorPresent : $((Get-CimInstance Win32_ComputerSystem).HypervisorPresent)"
          Write-Host "OS                : $((Get-CimInstance Win32_OperatingSystem).Caption)"
          Write-Host "--- docker client ---"
          docker version --format '{{.Client.Version}}' 2>&1 | Out-String | Write-Host
          Write-Host "--- compose plugin (install.ps1 needs `docker compose`) ---"
          docker compose version 2>&1 | Out-String | Write-Host
          # Probe only: a non-zero exit here is information, not failure.
          exit 0

      - name: Install WSL2 + Ubuntu
        shell: pwsh
        continue-on-error: true
        run: |
          wsl --set-default-version 2 2>&1 | Out-String | Write-Host
          wsl --install --no-launch -d Ubuntu-24.04 2>&1 | Out-String | Write-Host
          wsl --list --verbose 2>&1 | Out-String | Write-Host
          exit 0

      - name: Docker Engine inside WSL, listening on TCP
        id: wsld
        shell: pwsh
        continue-on-error: true
        run: |
          # Engine in WSL + the Windows docker.exe pointed at it over TCP. That
          # keeps install.ps1 running as a Windows script driving a Windows
          # `docker`, which is the shape a Docker Desktop user has -- rather than
          # testing a Linux script inside WSL, which would prove nothing new.
          wsl -d Ubuntu-24.04 -u root -- bash -lc "curl -fsSL https://get.docker.com | sh" 2>&1 | Out-String | Write-Host

          # get.docker.com already starts dockerd under systemd (WSL2 supports
          # systemd, and the installer reports "Using systemd to manage Docker
          # service"). So do NOT launch a second dockerd -- it loses the race for
          # the unix socket and dies, which is exactly why the first attempt saw
          # "Cannot connect to the Docker daemon at tcp://127.0.0.1:2375" while
          # the engine was in fact running perfectly on the unix socket.
          #
          # Override the unit to ALSO listen on TCP. `ExecStart=` on its own line
          # is required: systemd appends to ExecStart otherwise, and a unit with
          # two ExecStart lines fails to load.
          # Base64 the script rather than passing it as a command string. Both a
          # multi-line here-string AND a single line packed with && , quotes and
          # {{...}} were silently mangled between PowerShell and wsl.exe: the
          # step produced NO output at all, which reads exactly like a step that
          # did nothing. Base64 is a single argument of [A-Za-z0-9+/=] with no
          # character either layer can reinterpret.
          $script = @'
          set -x
          mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd -H unix:///var/run/docker.sock -H tcp://0.0.0.0:2375\n' > /etc/systemd/system/docker.service.d/tcp.conf
          cat /etc/systemd/system/docker.service.d/tcp.conf
          systemctl daemon-reload
          systemctl restart docker
          sleep 8
          systemctl is-active docker || journalctl -u docker --no-pager -n 30
          ss -ltn | grep 2375 || echo 'NOT LISTENING on 2375'
          docker -H tcp://127.0.0.1:2375 info --format '{{.OSType}}/{{.Architecture}}'
          '@ -replace "`r`n", "`n"
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          wsl -d Ubuntu-24.04 -u root -- bash -c "echo $b64 | base64 -d | bash" 2>&1 | Out-String | Write-Host
          exit 0

      - name: Can Windows reach the WSL daemon?
        shell: pwsh
        continue-on-error: true
        run: |
          $env:DOCKER_HOST = 'tcp://localhost:2375'
          docker info --format '{{.OSType}}/{{.Architecture}}' 2>&1 | Out-String | Write-Host
          # WSL2 localhost forwarding can lag; retry briefly before giving up.
          for ($i = 0; $i -lt 12; $i++) {
            $r = docker info --format '{{.OSType}}' 2>&1 | Out-String
            if ($r -match 'linux') { Write-Host "reachable from Windows after $i retries"; break }
            Start-Sleep -Seconds 5
          }
          exit 0

      - name: Install the studio with the RELEASE install.ps1
        id: install
        shell: pwsh
        continue-on-error: true
        env:
          VER: ${{ inputs.version || 'latest' }}
        run: |
          # WSL2 forwards listening sockets to Windows localhost.
          $env:DOCKER_HOST = 'tcp://localhost:2375'
          docker info --format '{{.OSType}}/{{.Architecture}}' 2>&1 | Out-String | Write-Host
          Invoke-WebRequest -UseBasicParsing https://get.exepad.com/install.ps1 -OutFile rel-install.ps1
          # -NoNode forces the embedded bootstrap: the path the MSI and the
          # one-click .bat take, and the one with no real-container coverage.
          & .\rel-install.ps1 -Yes -NoNode -Version "$env:VER-lite" -Dir "$PWD\inst" -Port 8097 2>&1 | Tee-Object install.log | Write-Host
          exit 0

      - name: Verdict
        shell: pwsh
        run: |
          $ok = $false
          if (Test-Path install.log) {
            $log = Get-Content install.log -Raw
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $r = Invoke-WebRequest -UseBasicParsing http://localhost:8097/ -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
              Start-Sleep -Seconds 5
            }
            Write-Host "studio answered 200 : $ok"
            Write-Host "setup token shown   : $($log -match 'Setup token:')"
          } else {
            Write-Host "install.ps1 never produced a log — see the steps above for where it stopped"
          }
          Write-Host "wsl-docker step     : ${{ steps.wsld.outcome }}"
          Write-Host "install step        : ${{ steps.install.outcome }}"
          Write-Host ""
          Write-Host "This job is exploratory; it reports and never fails the run."
